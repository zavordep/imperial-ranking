-gold:#e8bf5f;--gold2:#f8dd92;--red:#d6222b;--red-dark:#6e0d12;--green:#90d2ad;--miss:#ff9b9b;--display:'Cinzel',Georgia,'Times New Roman',serif}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 520px at 50% -180px,#5a0b10cc,transparent 70%),radial-gradient(700px 400px at 100% 0,#3a0a0d66,transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font:15px/1.5 system-ui,'Segoe UI',sans-serif;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}a{color:var(--gold)}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand .crest{width:48px;height:48px;border-radius:10px;flex:none;box-shadow:0 0 0 1px #8a6a2a,0 0 18px #d6222b55}
.brand b{display:block;font-family:var(--display);font-weight:900;font-size:20px;letter-spacing:2px;background:linear-gradient(180deg,var(--gold2),var(--gold) 55%,#a87a2a);-webkit-background-clip:text;background-clip:text;color:transparent}.brand small{display:block;font-size:10px;letter-spacing:2px;color:var(--muted)}
.crest{background-position:center;background-size:cover;background-repeat:no-repeat}
.badge{display:inline-block;border:1px solid #8a6a2a;background:#2a0c0e;color:var(--gold);border-radius:20px;padding:4px 12px;font-size:11px;white-space:nowrap}
nav{display:flex;gap:4px;margin:10px 0 0;overflow-x:auto}nav button{border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);padding:10px 14px;white-space:nowrap;letter-spacing:.5px}nav button.active{color:var(--gold);border-bottom-color:var(--red)}
h1,h2{font-family:var(--display);font-weight:800}h1{font-size:34px;letter-spacing:.5px;line-height:1.15;margin:6px 0;color:var(--ink);text-shadow:0 2px 18px #d6222b55}h2{font-size:19px;margin:0 0 12px;color:var(--gold2)}p{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:3px;color:var(--gold);font-weight:700}
.hero{display:flex;align-items:center;gap:22px;padding:26px 0 10px}.hero .crest{width:132px;height:132px;border-radius:18px;flex:none;box-shadow:0 0 0 1px #8a6a2a,0 10px 40px #d6222b66}.hero p{margin:4px 0 0}
.intro{padding:24px 0 8px}.intro p{margin:0}.updated{font-size:12px;color:var(--muted);margin-top:6px}
.prizes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.prize{position:relative;overflow:hidden;background:linear-gradient(115deg,#4a0f12,#1c1112 70%);border:1px solid #9a7432;border-radius:12px;padding:16px 18px;box-shadow:inset 0 1px 0 #f8dd9233,0 8px 30px #6e0d1244}.prize::after{content:'♛';position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:42px;color:#e8bf5f33}.prize.silver{background:linear-gradient(115deg,#2a2224,#161012 70%);border-color:#6a5c5e}.prize.silver::after{content:'♜';color:#d1d6de26}
.prize small{font-size:10px;letter-spacing:2px;color:#e4cfa6}.prize strong{display:block;font-family:var(--display);font-size:26px;color:var(--gold2)}.prize.silver strong{color:#dfe3ea}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.card,.panel{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:10px;padding:16px}.card{border-top:2px solid var(--red)}.card small{color:var(--muted);font-size:10px;letter-spacing:1.5px}.card strong{display:block;font-family:var(--display);font-size:24px;margin:4px 0 0;color:var(--gold2)}.card p{font-size:11px;margin:2px 0 0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:20px 0 12px}.tabs button{border:0;border-bottom:2px solid transparent;padding:10px 14px;background:none;color:var(--muted)}.tabs button.active{color:var(--gold);border-bottom-color:var(--red)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:0 0 14px}.filters>*{flex:1;min-width:150px}.filters .count{flex:0 0 auto;font-size:12px;color:var(--muted);padding:10px 0}
label{display:block;color:#d4c4bd;font-size:12px;margin:0 0 5px}input,select{width:100%;padding:10px 12px;color:var(--ink);background:#120c0d;border:1px solid #4a3133;border-radius:6px}input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}table{width:100%;border-collapse:collapse;white-space:nowrap}th{font-size:10px;color:#cdb9a0;letter-spacing:1px;text-align:left;padding:0;background:#120b0c;border-bottom:1px solid var(--red-dark)}td{padding:13px 14px;border-top:1px solid #2a1c1d;font-size:13px}tbody tr:hover{background:#d6222b0d}
tbody tr:nth-child(1) td:first-child,tbody tr:nth-child(2) td:first-child{color:var(--gold);font-weight:800}
.sort{display:flex;gap:6px;align-items:center;width:100%;border:0;background:none;color:inherit;font:inherit;letter-spacing:inherit;padding:14px}.sort:hover{color:var(--gold)}.sort i{font-style:normal;color:#7d6a66}th[aria-sort=ascending] i,th[aria-sort=descending] i{color:var(--gold)}
.member{background:none;border:0;color:var(--ink);padding:0;text-align:left;font-weight:650}.member:hover{color:var(--gold)}.tag{display:block;font-size:10px;color:#9a8884;font-weight:400;margin-top:2px}
.score{font-size:16px;font-weight:800;color:var(--gold2)}.hl{color:var(--gold);background:#e8bf5f0d}.muted{color:var(--muted)}.empty{text-align:center;padding:30px;color:var(--muted)}
.note{padding:12px 16px;background:#21100f;border-left:3px solid var(--red);font-size:13px;color:#e2d2c4;border-radius:4px;margin-top:16px}
.cell{display:inline-block;border:1px solid #4a3133;border-radius:5px;padding:6px 8px;color:var(--muted);background:#1a1112;font-size:11px;min-width:64px}.cell small{display:block;font-size:10px;color:#c7b4ae}.cell.ok{color:var(--gold2);background:#3a2a12;border-color:#7a5c22}.cell.miss{color:var(--miss);background:#3a1114;border-color:#7d1d22}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}.panel p,.panel li{font-size:13px}
dialog{width:min(820px,94vw);max-height:88vh;overflow:auto;background:linear-gradient(180deg,#22100f,#160e0f 220px);color:var(--ink);border:1px solid #8a6a2a;border-radius:14px;padding:22px;box-shadow:0 20px 60px #000c}dialog::backdrop{background:#000b}.close{float:right;background:none;border:0;color:#fff;font-size:30px;line-height:1}
.village{display:inline-block;margin:6px 0 4px;padding:10px 16px;border-radius:7px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a0c0e;font-weight:800;text-decoration:none;box-shadow:0 4px 16px #e8bf5f33}
.goal{border-bottom:1px solid var(--line);padding:10px 0}.goal div{display:flex;justify-content:space-between}.goal span{color:var(--gold)}.goal p{font-size:12px;margin:6px 0 0}progress{width:100%;height:8px;accent-color:var(--red)}
details{border-top:1px solid var(--line);padding:10px 0}summary{cursor:pointer;color:#e6d8cf}
footer{color:#8a7975;font-size:11px;margin-top:28px;padding-top:14px;border-top:1px solid var(--line)}.loading{padding:40px 0;color:var(--muted)}
@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}h1{font-size:25px}.hero{gap:14px;padding-top:18px}.hero .crest{width:88px;height:88px;border-radius:14px}.prize strong{font-size:21px}.prize::after{font-size:30px}td{padding:11px 10px}.sort{padding:12px 10px}.hide-sm{display:none}}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}.village.ghost{background:none;border:1px solid #8a6a2a;color:var(--gold2);box-shadow:none;cursor:pointer}
.war-now{margin:14px 0;border-left:3px solid var(--red)}.war-now h2{margin-bottom:4px}.war-now p{margin:6px 0}
.champion p{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin:8px 0;color:var(--ink)}.champion span{font-size:11px;letter-spacing:1px;color:var(--muted);min-width:120px}.champion .first b{font-family:var(--display);font-size:20px;color:var(--gold2)}.champion .second b{font-family:var(--display);font-size:17px;color:#dfe3ea}
.cards.five{grid-template-columns:repeat(5,1fr)}.rule-line{font-family:inherit!important;font-size:15px!important;line-height:1.3}

}
function champions() {
  return D.champions.length ? `<div class="grid">${D.champions.map(c => `<section class="panel champion"><div class="eyebrow">${esc(monthName(c.period).toUpperCase())}</div>${c.winners.map((w, i) => `<p class="${i ? 'second' : 'first'}"><span>${i ? '2º · 2.500 gemas' : '1º · 6.500 gemas'}</span><b>${esc(w.name)}</b> ${n(w.total)} pts</p>`).join('')}</section>`).join('')}</div>` : '<p class="muted">Os campeões aparecem aqui depois do encerramento de cada edição.</p>';
}
function render() {
  const nav = [['ranking', 'Ranking'], ['league', 'Guerras'], ['champions', 'Campeões'], ['rules', 'Regras']];
  const top = `<header><div class="brand"><div class="crest" role="img" aria-label="Brasão do Imperial"></div><span><b>${esc((D.clan.name || 'Imperial').toUpperCase())}</b><small>RANKING DO CLÃ · ${esc(D.clan.tag)}</small></span></div><span class="badge">${esc(modeLabel)}</span></header><nav>${nav.map(([k, v]) => `<button data-view="${k}" class="${view === k ? 'active' : ''}">${v}</button>`).join('')}</nav>`;
  const updated = `<div class="updated">Dados coletados em ${when(D.collectedAt)} (horário de Brasília) · ${D.clan.members} membros no clã · a página se atualiza sozinha</div>`;
  let body = '';
  if (view === 'ranking') body = `<div class="hero"><div class="crest" role="img" aria-label="Brasão do Imperial"></div><div><div class="eyebrow">EDIÇÃO DE ${esc(monthName(D.period).toUpperCase())}</div><h1>Cada contribuição conta.</h1><p>Liga, Raides, Jogos do Clã e doações: a soma do mês define os premiados.</p>${updated}</div></div>`
    + `<div class="prizes"><div class="prize"><small>1º LUGAR</small><strong>6.500 gemas</strong></div><div class="prize silver"><small>2º LUGAR</small><strong>2.500 gemas</strong></div></div>`
    + (statement ? `<div class="cards five">${[['LIGA', `3★ = ${n(C.league.stars[3])} pts`, `Falta: ${n(C.league.miss)}`], ['GUERRAS', `+${n(C.wars.attack)} ataque · +${n(C.wars.star)}/★`, `Não atacou: ${n(C.wars.miss)}`], ['CAPITAL', `+${n(C.capital.attack)} por ataque`, `Não usado: ${n(C.capital.unused)}`], ['JOGOS', `+1 a cada ${n(C.games.per)}`, `Não fez: ${n(C.games.none)}`], ['DOAÇÕES', `+1 a cada ${n(C.donations.per)}`, `Teto: ${C.donations.cap}`]].map(([t, a, b]) => `<div class="card"><small>${t}</small><strong class="rule-line">${a}</strong><p>${b}</p></div>`).join('')}</div>` : '')
    + (statement ? '' : `<div class="cards">${[['league', 'LIGA', 'Ataques da Liga de Guerras'], ['games', 'JOGOS', `Meta: ${n(R.gamesGoal)} pontos`], ['capital', 'CAPITAL', 'Ataques usados nos raides'], ['donations', 'DOAÇÕES', `Meta: ${n(R.donationsGoal)}`], ['wars', 'GUERRAS', 'Ataques usados nas guerras']].filter(([k]) => k !== 'wars' || showWars()).map(([k, t, d]) => `<div class="card"><small>${t}</small><strong>${W[k] || 0} pts</strong><p>${d}</p></div>`).join('')}</div>`) + currentWar()
    + `<div class="tabs">${Object.entries({ total: 'Geral', ...Object.fromEntries(cats.map(k => [k, labels[k]])) }).map(([k, v]) => `<button data-cat="${k}" class="${category === k ? 'active' : ''}">${v}</button>`).join('')}</div>${filters()}`
    + `<div class="table-wrap"><table><thead><tr>${headers()}</tr></thead><tbody id="rows">${rankingRows()}</tbody></table></div>`
    + `<div class="note">${D.startsAt ? `Contagem a partir de ${new Date(D.startsAt).toLocaleDateString('pt-BR', { timeZone: 'America/Sao_Paulo' })}. ` : ''}${R.preseason ? '<b>Pré-temporada:</b> este mês é um teste do novo sistema de pontos, sem prêmio. A partir do próximo mês vale para valer. ' : D.mode === 'simulation' ? 'Edição em simulação: nenhum vencedor confirmado. ' : ''}${statement ? 'Cada ação no jogo soma ou desconta pontos. Para disputar os prêmios: estar no clã há pelo menos 3 semanas no fim do mês.' : W.league > 0 ? `Para disputar os prêmios: mínimo de ${R.minRounds} rodadas de Liga contabilizadas.` : 'Edição sem Liga: disputam os prêmios os membros que estão no clã.'} Uma premiação por pessoa. Dados pendentes não são faltas. Toque no seu nome para ver o cálculo e guardar o link da sua ficha.</div>`;
  if (view === 'league') body = `<div class="intro"><div class="eyebrow">GUERRAS</div><h1>Cada ataque conta.</h1>${updated}</div>${currentWar()}<h2>Liga de Guerras · sete rodadas</h2>${filters()}<div class="table-wrap"><table><thead><tr><th><span class="sort">MEMBRO</span></th>${[1, 2, 3, 4, 5, 6, 7].map(i => `<th><span class="sort">R${i}</span></th>`).join('')}<th><span class="sort">LIGA / ${W.league}</span></th></tr></thead><tbody id="rows">${leagueRows()}</tbody></table></div><p class="muted" style="font-size:12px">★ estrelas do ataque · Falta: guerra encerrada sem ataque · Banco: não escalado (sem penalidade) · Disponível: ainda pode atacar.</p>`;
  if (view === 'champions') body = `<div class="intro"><div class="eyebrow">GALERIA</div><h1>Campeões do Imperial.</h1><p>Os premiados de cada edição encerrada.</p></div>${champions()}`;
  if (view === 'rules' && statement) body = `<div class="intro"><div class="eyebrow">TRANSPARÊNCIA</div><h1>Como pontuar.</h1><p>Cada ação no jogo soma ou desconta pontos. O ranking é a soma do mês.</p>${updated}</div><div class="grid"><section class="panel"><h2>Liga de Guerras</h2><p>3 estrelas = ${n(C.league.stars[3])} · 2 = ${n(C.league.stars[2])} · 1 = ${n(C.league.stars[1])} · zero estrelas = ${n(C.league.stars[0])}. Escalado e não atacou: <b>${n(C.league.miss)}</b>. Quem fica no banco não perde nada.</p><p>Atacar CV menor tem desconto de ${n(C.league.cvDiscount * 100)}% por nível (até ${n(C.league.cvDiscountMax * 100)}%). CV maior com 3 estrelas ganha bônus. Alvo autorizado pela liderança antes do ataque vale o valor cheio.</p></section><section class="panel"><h2>Guerras comuns</h2><p>+${n(C.wars.attack)} por ataque feito e +${n(C.wars.star)} por estrela. Ataque não feito: <b>${n(C.wars.miss)}</b>. Teto de ${C.wars.cap} pontos no mês. Guerras amistosas não contam.</p></section><section class="panel"><h2>Capital</h2><p>+${n(C.capital.attack)} por ataque usado, <b>${n(C.capital.unused)}</b> por ataque disponível não usado. Quem estava no clã e não atacou no fim de semana perde ${n(-C.capital.absentLimit * C.capital.unused)}. Quem entrou depois do início não perde.</p></section><section class="panel"><h2>Jogos do Clã e doações</h2><p>Jogos: +1 a cada ${n(C.games.per)} pontos (teto ${C.games.cap}). Quem estava no clã durante todo o evento e não fez nada perde <b>${-C.games.none}</b>.</p><p>Doações: +1 a cada ${n(C.donations.per)} tropas, feitiços e máquinas doadas (teto ${C.donations.cap}). Leitura automática do perfil.</p></section><section class="panel"><h2>Premiação</h2><p>1º lugar: 6.500 gemas · 2º lugar: 2.500 gemas. Uma premiação por pessoa. Para disputar: estar no clã há pelo menos 3 semanas no fim do mês. Revisão de 48 horas antes da entrega.</p></section></div>`;
  if (view === 'rules' && !statement) body = `<div class="intro"><div class="eyebrow">TRANSPARÊNCIA</div><h1>Regras da edição.</h1>${updated}</div><div class="grid"><section class="panel"><h2>Pontuação (total 100)</h2><p>${Object.keys(labels).filter(k => W[k] > 0).map(k => `${labels[k]} ${W[k]}`).join(' · ')}.</p><p>Jogos e doações são lidos automaticamente do perfil de cada membro. Jogos: proporcional à meta de ${n(R.gamesGoal)} pontos. Doações: proporcional à meta de ${n(R.donationsGoal)}. Capital: ataques usados ÷ ataques disponíveis nos fins de semana encerrados no mês.${W.wars > 0 ? ' Guerras comuns: ataques usados ÷ disponíveis nas guerras confirmadas do mês.' : ''}</p></section><section class="panel"><h2>Ataques da Liga</h2><p>3 estrelas = ${n(R.stars[3])} · 2 = ${n(R.stars[2])} · 1 = ${n(R.stars[1])} · zero estrelas = ${n(R.stars[0])} · falta = ${n(R.miss)}.</p><p>CV inferior: desconto de ${n(R.cvDiscount * 100)}% por nível (até 60%). CV superior: bônus de ${n(R.cvBonus * 100)}% por nível (até 30%), só com 3 estrelas. Mesmo CV: ${n(R.positionStep * 100)}% por posição (até 15%), bônus só com 3 estrelas. Alvo autorizado pela liderança antes do ataque vale a base, sem desconto.</p><p>Liga = média por rodada contabilizada ÷ ${n(R.leagueReference)} × ${W.league}, limitada ao máximo. Preparação e banco não geram falta.</p></section><section class="panel"><h2>Premiação</h2><p>1º lugar: 6.500 gemas · 2º lugar: 2.500 gemas. Uma premiação por pessoa, após conferência da liderança e revisão de 48 horas.</p><p>Desempate: pontos de Liga, média de estrelas por rodada e média de destruição.</p></section></div>`;
  $('#app').innerHTML = `<div class="wrap">${top}${body}<footer>Página somente leitura, atualizada automaticamente pelo painel da liderança. Dados da API oficial do Clash of Clans. Este material não é endossado pela Supercell.</footer></div>`;
  bind(); count(); saveHash();
}
function count() { const e = $('#count'); if (e) e.textContent = `${visible().length} de ${D.players.length}`; }
function refresh() { const rows = $('#rows'); if (rows) { rows.innerHTML = view === 'league' ? leagueRows() : rankingRows(); bindMembers(); } count(); }
function bindMembers() { $$('[data-p]').forEach(b => b.onclick = () => detail(b.dataset.p)); }
function bind() {
  bindMembers();
  $$('[data-view]').forEach(b => b.onclick = () => { view = b.dataset.view; render(); scrollTo(0, 0); });
  $$('[data-cat]').forEach(b => b.onclick = () => { category = b.dataset.cat; sort = null; render(); });
  $$('[data-sort]').forEach(b => b.onclick = () => { sort = { key: b.dataset.sort, dir: b.dataset.next }; render(); });
  if ($('#q')) $('#q').oninput = e => { search = e.target.value; refresh(); };
  if ($('#cv')) $('#cv').onchange = e => { cv = e.target.value; refresh(); };
  if ($('#st')) $('#st').onchange = e => { status = e.target.value; refresh(); };
}
function statementList(p) {
  const lines = p.statement || [];
  return `<h2 style="margin-top:16px">Extrato do mês</h2>${Object.keys(labels).map(k => { const ls = lines.filter(l => l.cat === k); return ls.length ? `<div class="stmt"><h3>${labels[k]} <span class="${p.components[k] < 0 ? 'neg' : 'pos'}">${p.components[k] > 0 ? '+' : ''}${n(p.components[k])}</span></h3>${ls.map(l => `<p><span>${esc(l.label)}</span><b class="${l.points < 0 ? 'neg' : 'pos'}">${l.points > 0 ? '+' : ''}${n(l.points)}</b></p>`).join('')}</div>` : ''; }).join('') || '<p>Nenhuma ação registrada neste mês ainda.</p>'}`;
}
function detail(tag) {
  const p = D.players.find(x => x.tag === tag); if (!p) return;
  openTag = tag; saveHash();
  const goal = (t, v, m, txt) => `<div class="goal"><div><strong>${t}</strong><span>${n(v)} / ${n(m)}</span></div><progress value="${Math.min(v, m)}" max="${m || 1}"></progress><p>${txt}</p></div>`;
  $('#detailContent').innerHTML = `<div class="eyebrow">FICHA DO MEMBRO</div><h1>${esc(p.name)}</h1><p>CV ${p.cv || '?'} · ${esc(p.tag)} · ${p.total > 0 ? p.rank + 'º no geral · ' : ''}${n(p.total)} ${statement ? 'pts' : '/ 100'} · ${statusText(p)}${p.current ? '' : ' · saiu do clã'}</p><div class="actions"><a class="village" href="${esc(p.link)}" target="_blank" rel="noopener">Ver vila no jogo ↗</a><button class="village ghost" id="copyLink">Copiar link da minha ficha</button></div>`
    + (statement ? statementList(p) : '') + (statement ? '' : (W.league > 0 ? goal('Liga', p.components.league, W.league, `${p.league.attacks} ataques, ${p.league.stars} estrelas, ${p.league.eligibleRounds} rodadas contabilizadas (mínimo ${R.minRounds}).`) : '')
    + goal('Jogos do Clã', p.components.games, W.games, p.games === null ? 'Aguardando a primeira leitura do perfil.' : `${n(p.games)} de ${n(R.gamesGoal)} pontos${p.gamesSource === 'manual' ? ' (corrigido pela liderança)' : ''}.`)
    + goal('Capital', p.components.capital, W.capital, p.capital.pending ? 'Fim de semana em conferência pela liderança.' : p.capital.limit ? `${p.capital.attacks} de ${p.capital.limit} ataques usados.` : 'Aguardando fim de semana encerrado.')
    + goal('Doações', p.components.donations, W.donations, `${n(p.donated)} de ${n(R.donationsGoal)} doações.`)
    + (W.wars > 0 ? goal('Guerras comuns', p.components.wars, W.wars, `${p.regular.used} de ${p.regular.available} ataques em ${p.regular.wars} guerras.`) : '')
    ) + (p.regular.wars ? `<p class="muted">Guerras comuns no mês: ${p.regular.wars} · ${p.regular.used} de ${p.regular.available} ataques · ${p.regular.stars} estrelas.</p>` : '')
    + `<h2 style="margin-top:18px">Ataques da Liga</h2>${p.league.rounds.slice().sort((a, b) => a.round - b.round).map(r => `<details open><summary>Rodada ${r.round} · ${esc(r.status)} · ${r.points == null ? 'pendente' : n(r.points) + ' pts'}</summary><p>${r.target ? `CV ${r.attackerCV} (#${r.attackerPosition}) → ${esc(r.target)}, CV ${r.targetCV} (#${r.targetPosition})<br>${r.stars} estrelas · ${r.destruction}% de destruição<br>` : ''}${esc(r.reason || 'Aguardando o ataque ou o fim da guerra.')}</p></details>`).join('') || '<p>Não escalado na Liga deste mês.</p>'}`;
  $('#copyLink').onclick = async () => { const url = location.origin + location.pathname + '#m=' + encodeURIComponent(tag); try { await navigator.clipboard.writeText(url); $('#copyLink').textContent = 'Link copiado ✓'; } catch { prompt('Copie o link da sua ficha:', url); } };
  if (!$('#details').open) $('#details').showModal();
}
function closeDetail() { $('#details').close(); openTag = null; saveHash(); }
$('.close').onclick = closeDetail;
$('#details').onclick = e => { if (e.target === $('#details')) closeDetail(); };
$('#details').addEventListener('cancel', e => { e.preventDefault(); closeDetail(); });
render();
if (openTag) detail(openTag);
// Link de ficha aberto com a página já carregada (mesmo endereço, só muda o #).
window.addEventListener('hashchange', () => { const tag = new URLSearchParams(location.hash.slice(1)).get('m'); if (tag) detail(tag); });
// Recarrega a cada 5 minutos para buscar a versão mais recente, sem interromper quem está digitando.
setInterval(() => { if (!document.querySelector('input:focus,select:focus')) location.reload(); }, 300000);
})();
</script></body></html>
